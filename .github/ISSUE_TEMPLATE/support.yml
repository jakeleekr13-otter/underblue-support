name: Support request
description: Ask a non-private question or describe a problem in words.
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not attach photos, videos, diagnostic files, email addresses or other private information.
        To share a file, email support@enheart.me instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and the steps that led to it.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: iPhone model, iOS version and UnderBlue version
      placeholder: iPhone 16 Pro, iOS 26.1, UnderBlue 1.0
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not attach photos, videos, diagnostic files or personal information.
          required: true
